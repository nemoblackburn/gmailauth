<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #202124;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .status.connected {
      background: #e6f4ea;
      color: #137333;
    }

    .status.disconnected {
      background: #fce8e6;
      color: #c5221f;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status.connected .status-dot {
      background: #137333;
    }

    .status.disconnected .status-dot {
      background: #c5221f;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover {
      background: #1765cc;
    }

    button:disabled {
      background: #dadce0;
      cursor: not-allowed;
    }

    .info {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #5f6368;
      line-height: 1.5;
    }

    .feature {
      display: flex;
      align-items: start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .feature svg {
      flex-shrink: 0;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h1>Gmail Auth Code AutoFill</h1>

  <div id="status" class="status disconnected">
    <span class="status-dot"></span>
    <span id="statusText">Checking connection...</span>
  </div>

  <button id="authButton">Connect Gmail</button>

  <div class="info">
    <div class="feature">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>Automatically detects verification code fields</span>
    </div>
    <div class="feature">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>Reads codes from Gmail (last 5 minutes)</span>
    </div>
    <div class="feature">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>Matches sender domain with current site</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
